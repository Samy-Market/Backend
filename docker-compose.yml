name: asistencia

services:
  postgres:
    image: postgres:16-alpine
    container_name: asistencia-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asistencia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asistencia}
      POSTGRES_DB: ${POSTGRES_DB:-asistencia}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asistencia}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
